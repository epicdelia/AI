name: Mac app

on:
  pull_request:
    paths: ["mac/**", "app.py", "scripts/export_mac_prompts.py", "static/icon-512.png", ".github/workflows/mac.yml"]
  push:
    branches: [master]
    paths: ["mac/**", "app.py", "scripts/export_mac_prompts.py", "static/icon-512.png", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: mac
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (FlowCore)
        working-directory: mac
        run: swift test
      - name: Build Flow.app
        run: ./mac/build_app.sh
      - name: Launch smoke test (starts and stays up)
        run: |
          open mac/build/Flow.app
          sleep 8
          pgrep -x Flow
          pkill -x Flow || true
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-mac
          path: mac/build/Flow.zip
          retention-days: 30
