name: Creator Studio Mobile CI/CD

on:
  push:
    branches:
      - master
      - main
      - develop
      - "claude/copilot-dark-love"
      - "copilot-dark-love"
      - "copilot dark love"
      - "*copilot*"
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches:
      - master
      - main
      - develop
      - "claude/copilot-dark-love"
      - "copilot-dark-love"
      - "copilot dark love"
      - "*copilot*"
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      run_lint:
        description: "Run code quality and style checks"
        type: boolean
        default: true
      run_tests:
        description: "Run multiplatform test suite"
        type: boolean
        default: true
      build_desktop:
        description: "Build Compose Desktop distributions (Linux/macOS/Windows)"
        type: boolean
        default: true
      build_android:
        description: "Build Android APK & AAB bundles"
        type: boolean
        default: true
      publish_artifacts:
        description: "Attach compiled binaries to GitHub Release"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # =========================================================================
  # 1. Code Quality, Style & Linting
  # =========================================================================
  mobile-lint-and-quality:
    name: "Mobile Code Quality & Static Analysis"
    if: github.event_name != 'workflow_dispatch' || inputs.run_lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Check Dependencies & Configurations
        run: ./gradlew dependencies --configuration commonMainImplementation --dry-run || true

  # =========================================================================
  # 2. Multiplatform Unit & Compose Tests
  # =========================================================================
  mobile-unit-tests:
    name: "Mobile Unit & Multiplatform Tests"
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Multiplatform Tests
        run: ./gradlew test --continue || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          path: mobile/**/build/reports/tests/
          retention-days: 14

  # =========================================================================
  # 3. Android APK Build
  # =========================================================================
  mobile-build-android:
    name: "Build Android APK"
    needs: [mobile-lint-and-quality]
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Ubuntu-latest runners already have ANDROID_HOME pre-configured with Android SDK

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-android-debug-apk
          path: mobile/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 30

  # =========================================================================
  # 4. Compose Desktop Cross-Platform Binaries
  # =========================================================================
  mobile-build-desktop:
    name: "Build Compose Desktop (${{ matrix.os }})"
    needs: [mobile-lint-and-quality]
    if: github.event_name != 'workflow_dispatch' || inputs.build_desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_ext: "deb"
          - os: windows-latest
            artifact_ext: "msi"
          - os: macos-latest
            artifact_ext: "dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Linux Packaging Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package Native Desktop Distribution
        run: ./gradlew packageDistributionForCurrentOS

      - name: Upload Desktop Binary (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-desktop-${{ matrix.os }}
          path: |
            mobile/composeApp/build/compose/binaries/main/**/*.${{ matrix.artifact_ext }}
            mobile/composeApp/build/compose/binaries/main/**/*.exe
            mobile/composeApp/build/compose/binaries/main/**/*.zip
          retention-days: 30

  # =========================================================================
  # 5. Release & Publication to GitHub Releases
  # =========================================================================
  mobile-release-publication:
    name: "Publish Release Binaries"
    needs: [mobile-build-android, mobile-build-desktop]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_artifacts)
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: creator-studio-android-debug-apk
          path: release-assets/android

      - name: Download Desktop Ubuntu
        uses: actions/download-artifact@v4
        with:
          name: creator-studio-desktop-ubuntu-latest
          path: release-assets/linux
        continue-on-error: true

      - name: Download Desktop Windows
        uses: actions/download-artifact@v4
        with:
          name: creator-studio-desktop-windows-latest
          path: release-assets/windows
        continue-on-error: true

      - name: Download Desktop macOS
        uses: actions/download-artifact@v4
        with:
          name: creator-studio-desktop-macos-latest
          path: release-assets/macos
        continue-on-error: true

      - name: Publish Binaries to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
