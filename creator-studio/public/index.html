<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creator Studio</title>
  <meta name="theme-color" content="#fdfaf8">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint (no white flash in dark mode). Logic mirrors js/theme.js.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('studio-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <link rel="stylesheet" href="/css/studio.css?v=4">
  <link rel="stylesheet" href="/css/components.css?v=6">
  <link rel="stylesheet" href="/css/copilot.css?v=1">
</head>
<body>
  <div id="app"></div>
  <div id="toast-container" aria-live="polite"></div>
  <noscript>Creator Studio needs JavaScript enabled.</noscript>
  <script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
