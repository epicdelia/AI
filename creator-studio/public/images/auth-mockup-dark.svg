<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <filter id="shadow-dark" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <linearGradient id="unicorn-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f06a9b" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241d29" />
      <stop offset="100%" stop-color="#1b1520" />
    </linearGradient>
  </defs>

  <!-- Dark Desktop Background Canvas -->
  <rect x="0" y="0" width="1440" height="960" rx="20" fill="#0d0912" />
  
  <!-- Outer Boxed Frame (Dark Studio Sheet) -->
  <rect x="40" y="30" width="1360" height="900" rx="24" fill="#17131a" stroke="#372d3c" stroke-width="1.5" filter="url(#shadow-dark)" />

  <!-- App Header -->
  <rect x="40" y="30" width="1360" height="68" rx="24" fill="#1f1823" />
  <rect x="40" y="97" width="1360" height="1" fill="#372d3c" />

  <!-- Brand Mark Icon -->
  <rect x="68" y="48" width="32" height="32" rx="9" fill="url(#unicorn-grad-dark)" />
  <text x="84" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">🦄</text>

  <!-- Mega Menu Tabs (Dark) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f2eaf1">
    <text x="124" y="69" fill="#f06a9b">Dashboard</text>
    <circle cx="118" cy="65" r="3" fill="#f06a9b" />
    <text x="230" y="69">YouTube</text>
    <text x="316" y="69">Social</text>
    <text x="382" y="69">Brand Deals</text>
    <text x="490" y="69">Code Cards</text>
  </g>

  <!-- Search Bar (Ctrl+K Dark) -->
  <rect x="620" y="44" width="380" height="40" rx="10" fill="#261e2b" stroke="#3d3043" stroke-width="1" />
  <circle cx="642" cy="64" r="6" stroke="#9d8ba2" stroke-width="1.8" fill="none" />
  <line x1="646" y1="68" x2="652" y2="74" stroke="#9d8ba2" stroke-width="1.8" stroke-linecap="round" />
  <text x="664" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9d8ba2">Search scripts, brand deals, ideas…</text>
  <rect x="946" y="52" width="42" height="24" rx="6" fill="#382c3f" />
  <text x="967" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbbacb" text-anchor="middle">⌘ K</text>

  <!-- Header Right Actions: Bell, Copilot, Avatar -->
  <circle cx="1270" cy="64" r="18" fill="#281f2d" />
  <circle cx="1278" cy="56" r="4" fill="#f06a9b" />
  <rect x="1302" y="46" width="76" height="36" rx="18" fill="#2e1b27" stroke="#4a2538" stroke-width="1" />
  <circle cx="1320" cy="64" r="10" fill="url(#unicorn-grad-dark)" />
  <text x="1320" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
  <text x="1346" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f06a9b">Delia</text>

  <!-- Main Content Layout (Dark) -->
  <!-- 1. Hero Card -->
  <rect x="76" y="124" width="1288" height="150" rx="16" fill="url(#card-grad-dark)" stroke="#372d3c" stroke-width="1.2" />
  <text x="108" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f06a9b" letter-spacing="0.08em">GOOD AFTERNOON, DELIA (@TECH.UNICORN)</text>
  <text x="108" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f2eaf1">Week 4 of 12 · 3 days left</text>
  <text x="108" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a99cae">This week’s video: “Why Senior Engineers Write Less Code (And What They Do Instead)”</text>

  <rect x="1170" y="152" width="162" height="94" rx="12" fill="#341825" stroke="#4c2136" stroke-width="1" />
  <text x="1251" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f06a9b" text-anchor="middle">4🔥</text>
  <text x="1251" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f9a8d4" text-anchor="middle">WEEK STREAK</text>

  <!-- 2. Four KPI Metric Boxes (Dark) -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Box 1 -->
    <rect x="76" y="296" width="308" height="96" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
    <text x="102" y="342" font-size="32" font-weight="900" fill="#f06a9b">184,500</text>
    <text x="102" y="370" font-size="13" font-weight="600" fill="#a99cae">Total Tech Community</text>

    <!-- Box 2 -->
    <rect x="402" y="296" width="308" height="96" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
    <text x="428" y="342" font-size="32" font-weight="900" fill="#38bdf8">$16,200</text>
    <text x="428" y="370" font-size="13" font-weight="600" fill="#a99cae">Active Sponsorship Deals</text>

    <!-- Box 3 -->
    <rect x="728" y="296" width="308" height="96" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
    <text x="754" y="342" font-size="32" font-weight="900" fill="#4ade80">7.8%</text>
    <text x="754" y="370" font-size="13" font-weight="600" fill="#a99cae">Avg LinkedIn Engagement</text>

    <!-- Box 4 -->
    <rect x="1054" y="296" width="310" height="96" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
    <text x="1080" y="342" font-size="32" font-weight="900" fill="#c084fc">14</text>
    <text x="1080" y="370" font-size="13" font-weight="600" fill="#a99cae">Videos & Posts Shipped</text>
  </g>

  <!-- 3. Left Column: Next Step & Brand Deals (Dark) -->
  <!-- Next Step Card -->
  <rect x="76" y="414" width="624" height="230" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
  <text x="102" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f06a9b" letter-spacing="0.08em">NEXT STEP FOR THIS WEEK’S VIDEO</text>
  <text x="102" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#f2eaf1">Fill 1 [YOUR STORY] and review Notion ad read segue</text>
  <text x="102" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a99cae">Your 60s sponsor read for Notion is inserted with natural transition hook at 03:45.</text>
  <rect x="102" y="534" width="180" height="38" rx="8" fill="#f06a9b" />
  <text x="192" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Open Script Editor →</text>

  <!-- Brand Deals Summary Card -->
  <rect x="76" y="666" width="624" height="236" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
  <text x="102" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f2eaf1">Active Brand Sponsorships</text>
  
  <rect x="102" y="718" width="572" height="48" rx="8" fill="#1b1520" stroke="#2d2232" stroke-width="1" />
  <text x="120" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f2eaf1">Supabase</text>
  <rect x="210" y="731" width="130" height="22" rx="6" fill="#0c4a6e" />
  <text x="275" y="746" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">YouTube 60s + LinkedIn</text>
  <text x="650" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f06a9b" text-anchor="end">$3,500 · Contracted</text>

  <rect x="102" y="776" width="572" height="48" rx="8" fill="#1b1520" stroke="#2d2232" stroke-width="1" />
  <text x="120" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f2eaf1">Cursor AI</text>
  <rect x="200" y="789" width="110" height="22" rx="6" fill="#78350f" />
  <text x="255" y="804" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">Omnichannel Tech</text>
  <text x="650" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f06a9b" text-anchor="end">$5,200 · Production</text>

  <rect x="102" y="834" width="572" height="48" rx="8" fill="#1b1520" stroke="#2d2232" stroke-width="1" />
  <text x="120" y="863" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f2eaf1">Linear</text>
  <rect x="180" y="847" width="90" height="22" rx="6" fill="#14532d" />
  <text x="225" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle">LinkedIn Post</text>
  <text x="650" y="863" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#4ade80" text-anchor="end">$2,500 · Invoiced</text>

  <!-- 4. Right Column: Code Card Studio Preview (Dark) -->
  <rect x="722" y="414" width="642" height="488" rx="14" fill="#211b25" stroke="#372d3c" stroke-width="1.2" />
  <text x="750" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#f2eaf1">Tech & Code Snippet Studio</text>
  <text x="750" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a99cae">Visual code card ready for LinkedIn carousel and Instagram:</text>

  <!-- Rendered Neon Gradient Code Card -->
  <g transform="translate(750, 484)">
    <rect width="586" height="394" rx="14" fill="url(#unicorn-grad-dark)" />
    
    <!-- Code Window inside card -->
    <rect x="24" y="24" width="538" height="346" rx="10" fill="#0f0c14" />
    
    <!-- Window buttons -->
    <circle cx="44" cy="44" r="5" fill="#ff5f56" />
    <circle cx="60" cy="44" r="5" fill="#ffbd2e" />
    <circle cx="76" cy="44" r="5" fill="#27c93f" />
    <text x="293" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#9d8ba2" text-anchor="middle">agent.ts</text>

    <!-- Code Lines -->
    <g font-family="monospace" font-size="13" fill="#e2d9e6">
      <text x="44" y="84"><tspan fill="#f43f5e">import</tspan> { Agent, Tool } <tspan fill="#f43f5e">from</tspan> <tspan fill="#a7f3d0">'@unicorn/ai'</tspan>;</text>
      <text x="44" y="112"><tspan fill="#c084fc">const</tspan> agent = <tspan fill="#38bdf8">new</tspan> Agent({</text>
      <text x="64" y="140">model: <tspan fill="#a7f3d0">'claude-3-7-sonnet'</tspan>,</text>
      <text x="64" y="168">voice: <tspan fill="#a7f3d0">'Delia (@Tech.Unicorn)'</tspan>,</text>
      <text x="64" y="196">tools: [Tool.webSearch(), Tool.codeSandbox()],</text>
      <text x="44" y="224">});</text>
      <text x="44" y="260"><tspan fill="#c084fc">const</tspan> audit = <tspan fill="#f43f5e">await</tspan> agent.auditCodebase();</text>
      <text x="44" y="288">console.log(audit.summary);</text>
    </g>

    <text x="542" y="356" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="end">@Tech.Unicorn</text>
  </g>
</svg>
