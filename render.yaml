# One-click public deploy of Flow on Render's free tier.
# Render → New → Blueprint → pick this repo. It asks for your AssemblyAI key.
services:
  - type: web
    name: flow-dictation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ASSEMBLYAI_API_KEY
        sync: false
