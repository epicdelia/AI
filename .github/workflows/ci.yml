name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -q pytest ruff
      - run: ./scripts/check.sh

  guard:
    name: guard
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'night/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # Run the guard as it exists on the BASE branch so a PR can't edit its own judge.
      - name: Load guard from base
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:scripts/guard.sh" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:scripts/guard.sh" > "$RUNNER_TEMP/guard.sh"
          else
            echo "::warning::No guard on base branch yet; using PR copy."
            cp scripts/guard.sh "$RUNNER_TEMP/guard.sh"
          fi
      - run: bash "$RUNNER_TEMP/guard.sh" "origin/${{ github.base_ref }}" "${{ github.head_ref }}"
