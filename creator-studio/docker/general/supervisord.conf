[supervisord]
nodaemon=true

[program:cron]
command=/usr/sbin/cron -l 2 -f
autostart=true
autorestart=true

; Background jobs (memory indexing, AI tasks): QUEUE_CONNECTION=database needs a worker.
; Restarted hourly (--max-time) so deploys pick up new code.
[program:queue]
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=2 --timeout=600 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=620
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
