<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The signed-out page is her public landing page, so search engines and link previews describe it; the studio retitles each page once signed in. -->
  <title>Tech Unicorn · Delia Lazarescu, Engineer &amp; Creator</title>
  <meta name="description" content="Making tech less scary: ex-Google engineer, creator for 470K+ people, and founder building AI-powered apps. MVP builds, AI integration, consulting, speaking and brand partnerships.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tech Unicorn · Delia Lazarescu">
  <meta property="og:description" content="Ex-Google engineer and creator. Vibecoded MVPs in 2 to 4 weeks, practical AI integration, consulting, speaking and brand partnerships.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#fdfaf8">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint (no white flash in dark mode). Logic mirrors js/theme.js.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('studio-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme-pref', pref);
      // Her accent, text size and density (Settings → Make it yours), cached from the last visit.
      try {
        var p = JSON.parse(localStorage.getItem('studio-prefs') || '{}');
        if (p.accent) document.documentElement.setAttribute('data-accent', p.accent);
        if (p.text) document.documentElement.setAttribute('data-text', p.text);
        if (p.density) document.documentElement.setAttribute('data-density', p.density);
        document.documentElement.setAttribute('data-nav', p.nav || 'top');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
