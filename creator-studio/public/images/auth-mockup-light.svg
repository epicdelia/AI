<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960">
  <defs>
    <filter id="shadow-light" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#432238" flood-opacity="0.12" />
    </filter>
    <linearGradient id="unicorn-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fcf9fb" />
    </linearGradient>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="1440" height="960" rx="20" fill="#f8f4f7" />
  
  <!-- Outer Boxed Frame -->
  <rect x="40" y="30" width="1360" height="900" rx="24" fill="#ffffff" stroke="#ebdce5" stroke-width="1.5" filter="url(#shadow-light)" />

  <!-- App Header -->
  <rect x="40" y="30" width="1360" height="68" rx="24" fill="#ffffff" />
  <rect x="40" y="97" width="1360" height="1" fill="#ebdce5" />

  <!-- Brand Mark Icon -->
  <rect x="68" y="48" width="32" height="32" rx="9" fill="url(#unicorn-grad-light)" />
  <text x="84" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">🦄</text>

  <!-- Mega Menu Tabs -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#2b2230">
    <text x="124" y="69" fill="#e11d48">Dashboard</text>
    <circle cx="118" cy="65" r="3" fill="#e11d48" />
    <text x="230" y="69">YouTube</text>
    <text x="316" y="69">Social</text>
    <text x="382" y="69">Brand Deals</text>
    <text x="490" y="69">Code Cards</text>
  </g>

  <!-- Search Bar (Ctrl+K) -->
  <rect x="620" y="44" width="380" height="40" rx="10" fill="#f6eff4" stroke="#ebdce5" stroke-width="1" />
  <circle cx="642" cy="64" r="6" stroke="#968393" stroke-width="1.8" fill="none" />
  <line x1="646" y1="68" x2="652" y2="74" stroke="#968393" stroke-width="1.8" stroke-linecap="round" />
  <text x="664" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#968393">Search scripts, brand deals, ideas…</text>
  <rect x="946" y="52" width="42" height="24" rx="6" fill="#ebdce5" />
  <text x="967" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5c4558" text-anchor="middle">⌘ K</text>

  <!-- Header Right Actions: Bell, Copilot, Avatar -->
  <circle cx="1270" cy="64" r="18" fill="#f6eff4" />
  <circle cx="1278" cy="56" r="4" fill="#e11d48" />
  <rect x="1302" y="46" width="76" height="36" rx="18" fill="#fdf2f7" stroke="#fbcfe8" stroke-width="1" />
  <circle cx="1320" cy="64" r="10" fill="url(#unicorn-grad-light)" />
  <text x="1320" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
  <text x="1346" y="69" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e11d48">Delia</text>

  <!-- Main Content Layout -->
  <!-- 1. Hero Card: Good morning Delia, shipping streak -->
  <rect x="76" y="124" width="1288" height="150" rx="16" fill="url(#card-grad-light)" stroke="#ebdce5" stroke-width="1.2" />
  <text x="108" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e11d48" letter-spacing="0.08em">GOOD AFTERNOON, DELIA (@TECH.UNICORN)</text>
  <text x="108" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#2b2230">Week 4 of 12 · 3 days left</text>
  <text x="108" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#756172">This week’s video: “Why Senior Engineers Write Less Code (And What They Do Instead)”</text>

  <rect x="1170" y="152" width="162" height="94" rx="12" fill="#fff1f5" stroke="#ffe4e6" stroke-width="1" />
  <text x="1251" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#e11d48" text-anchor="middle">4🔥</text>
  <text x="1251" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle">WEEK STREAK</text>

  <!-- 2. Four KPI Metric Boxes -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Box 1 -->
    <rect x="76" y="296" width="308" height="96" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
    <text x="102" y="342" font-size="32" font-weight="900" fill="#e11d48">184,500</text>
    <text x="102" y="370" font-size="13" font-weight="600" fill="#756172">Total Tech Community</text>

    <!-- Box 2 -->
    <rect x="402" y="296" width="308" height="96" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
    <text x="428" y="342" font-size="32" font-weight="900" fill="#0284c7">$16,200</text>
    <text x="428" y="370" font-size="13" font-weight="600" fill="#756172">Active Sponsorship Deals</text>

    <!-- Box 3 -->
    <rect x="728" y="296" width="308" height="96" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
    <text x="754" y="342" font-size="32" font-weight="900" fill="#16a34a">7.8%</text>
    <text x="754" y="370" font-size="13" font-weight="600" fill="#756172">Avg LinkedIn Engagement</text>

    <!-- Box 4 -->
    <rect x="1054" y="296" width="310" height="96" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
    <text x="1080" y="342" font-size="32" font-weight="900" fill="#9333ea">14</text>
    <text x="1080" y="370" font-size="13" font-weight="600" fill="#756172">Videos & Posts Shipped</text>
  </g>

  <!-- 3. Left Column: Next Step & Brand Deals -->
  <!-- Next Step Card -->
  <rect x="76" y="414" width="624" height="230" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
  <text x="102" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#e11d48" letter-spacing="0.08em">NEXT STEP FOR THIS WEEK’S VIDEO</text>
  <text x="102" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#2b2230">Fill 1 [YOUR STORY] and review Notion ad read segue</text>
  <text x="102" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#756172">Your 60s sponsor read for Notion is inserted with natural transition hook at 03:45.</text>
  <rect x="102" y="534" width="180" height="38" rx="8" fill="#e11d48" />
  <text x="192" y="558" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Open Script Editor →</text>

  <!-- Brand Deals Summary Card -->
  <rect x="76" y="666" width="624" height="236" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
  <text x="102" y="698" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2b2230">Active Brand Sponsorships</text>
  
  <rect x="102" y="718" width="572" height="48" rx="8" fill="#fcf9fb" stroke="#f3e8f0" stroke-width="1" />
  <text x="120" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2b2230">Supabase</text>
  <rect x="210" y="731" width="130" height="22" rx="6" fill="#e0f2fe" />
  <text x="275" y="746" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">YouTube 60s + LinkedIn</text>
  <text x="650" y="747" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">$3,500 · Contracted</text>

  <rect x="102" y="776" width="572" height="48" rx="8" fill="#fcf9fb" stroke="#f3e8f0" stroke-width="1" />
  <text x="120" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2b2230">Cursor AI</text>
  <rect x="200" y="789" width="110" height="22" rx="6" fill="#fef3c7" />
  <text x="255" y="804" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Omnichannel Tech</text>
  <text x="650" y="805" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#e11d48" text-anchor="end">$5,200 · Production</text>

  <rect x="102" y="834" width="572" height="48" rx="8" fill="#fcf9fb" stroke="#f3e8f0" stroke-width="1" />
  <text x="120" y="863" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2b2230">Linear</text>
  <rect x="180" y="847" width="90" height="22" rx="6" fill="#dcfce7" />
  <text x="225" y="862" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">LinkedIn Post</text>
  <text x="650" y="863" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#15803d" text-anchor="end">$2,500 · Invoiced</text>

  <!-- 4. Right Column: Code Card Studio Preview -->
  <rect x="722" y="414" width="642" height="488" rx="14" fill="#ffffff" stroke="#ebdce5" stroke-width="1.2" />
  <text x="750" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#2b2230">Tech & Code Snippet Studio</text>
  <text x="750" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#756172">Visual code card ready for LinkedIn carousel and Instagram:</text>

  <!-- Rendered Neon Gradient Code Card -->
  <g transform="translate(750, 484)">
    <rect width="586" height="394" rx="14" fill="url(#unicorn-grad-light)" />
    
    <!-- Code Window inside card -->
    <rect x="24" y="24" width="538" height="346" rx="10" fill="#1e1e2e" />
    
    <!-- Window buttons -->
    <circle cx="44" cy="44" r="5" fill="#ff5f56" />
    <circle cx="60" cy="44" r="5" fill="#ffbd2e" />
    <circle cx="76" cy="44" r="5" fill="#27c93f" />
    <text x="293" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#a6adc8" text-anchor="middle">agent.ts</text>

    <!-- Code Lines -->
    <g font-family="monospace" font-size="13" fill="#cdd6f4">
      <text x="44" y="84"><tspan fill="#f38ba8">import</tspan> { Agent, Tool } <tspan fill="#f38ba8">from</tspan> <tspan fill="#a6e3a1">'@unicorn/ai'</tspan>;</text>
      <text x="44" y="112"><tspan fill="#cba6f7">const</tspan> agent = <tspan fill="#89dceb">new</tspan> Agent({</text>
      <text x="64" y="140">model: <tspan fill="#a6e3a1">'claude-3-7-sonnet'</tspan>,</text>
      <text x="64" y="168">voice: <tspan fill="#a6e3a1">'Delia (@Tech.Unicorn)'</tspan>,</text>
      <text x="64" y="196">tools: [Tool.webSearch(), Tool.codeSandbox()],</text>
      <text x="44" y="224">});</text>
      <text x="44" y="260"><tspan fill="#cba6f7">const</tspan> audit = <tspan fill="#f38ba8">await</tspan> agent.auditCodebase();</text>
      <text x="44" y="288">console.log(audit.summary);</text>
    </g>

    <text x="542" y="356" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.8" text-anchor="end">@Tech.Unicorn</text>
  </g>
</svg>
