<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow: dictate anywhere</title>
<style>
  body { margin:0; background:#0f172a; color:#f1f5f9; font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; min-width:340px; }
  main { max-width:560px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; } h1 span { color:#38bdf8; }
  p.hint { color:#94a3b8; margin:0 0 16px; }
  kbd { background:#1e293b; border:1px solid #334155; border-bottom-width:3px; border-radius:6px; padding:0 6px; font-size:13px; }
  label { display:block; margin:12px 0 4px; color:#94a3b8; font-size:13px; }
  input, select, textarea { width:100%; box-sizing:border-box; background:#1e293b; color:#f1f5f9; border:1px solid #334155; border-radius:10px; padding:8px 10px; font:inherit; }
  textarea { min-height:70px; }
  .row { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:8px 14px; cursor:pointer; background:#38bdf8; color:#0f172a; }
  button.ghost { background:transparent; color:#38bdf8; border:1px solid #334155; }
  #status { margin-top:14px; min-height:1.5em; }
  #status .ok { color:#34d399; } #status .bad { color:#fca5a5; }
  ul { padding-left:18px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h1>Flow <span>· dictate anywhere</span></h1>
  <p class="hint">Click into any text box, hold <kbd>Option/Alt</kbd>+<kbd>Space</kbd>, speak, let go. Polished text is typed where your cursor is.
    Or press <kbd>Alt+Shift+D</kbd> to start and again to stop.</p>

  <button id="mic">1. Allow microphone</button>

  <label for="serverUrl">2. Flow server</label>
  <input id="serverUrl" placeholder="https://flow-dictation.onrender.com">

  <label for="style">Style</label>
  <select id="style">
    <option value="site">Match the site (Gmail → email, Slack → message, Notion → notes)</option>
    <option value="message">Message (chat, Slack)</option>
    <option value="email">Email</option>
    <option value="notes">Notes</option>
    <option value="auto">Auto</option>
  </select>

  <label for="lang">Language</label>
  <select id="lang"><option value="en">English</option><option value="multi">Any language (auto-detect)</option></select>

  <label for="dict">Personal dictionary (names and jargon, one per line)</label>
  <textarea id="dict" placeholder="AssemblyAI&#10;Siobhan&#10;Kubernetes"></textarea>

  <label for="snippets">Snippets: say the cue, get the exact text (one per line: <code>cue =&gt; text</code>)</label>
  <textarea id="snippets" placeholder="my calendly link => https://calendly.com/you/30min&#10;my address => 1 Infinite Loop, Cupertino"></textarea>

  <div class="row"><button id="save">Save</button><button id="check" class="ghost">Check setup</button></div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="options.js"></script>
</body>
</html>
